services:
  postgres:
    image: postgres:17-alpine
    container_name: armin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-armin_security}
      POSTGRES_USER: ${POSTGRES_USER:-armin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-armin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - armin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-armin} -d ${POSTGRES_DB:-armin_security}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: armin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - armin_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: armin-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-armin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-arminpassword}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - armin_minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    container_name: armin-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set armin http://minio:9000
      ${STORAGE_ACCESS_KEY:-armin}
      ${STORAGE_SECRET_KEY:-arminpassword};
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing
      armin/${STORAGE_BUCKET:-armin-security};
      exit 0;
      "

volumes:
  armin_postgres_data:
  armin_redis_data:
  armin_minio_data: